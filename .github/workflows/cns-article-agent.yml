name: CNS Article Agent V6.1 Production

on:
  workflow_dispatch:

  schedule:
    # Paris 10:30 during daylight-saving time (CEST, UTC+2)
    - cron: "30 8 * * *"

    # Paris 10:30 during standard time (CET, UTC+1)
    - cron: "30 9 * * *"

permissions:
  contents: write

concurrency:
  group: cns-article-agent-production
  cancel-in-progress: false

jobs:
  cns-production:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Paris schedule
        id: paris_gate
        shell: bash
        run: |
          # Manual runs are always allowed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: allowed."
            echo "run_agent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PARIS_DATE="$(TZ=Europe/Paris date '+%Y-%m-%d')"
          PARIS_TIME="$(TZ=Europe/Paris date '+%H:%M:%S')"
          PARIS_OFFSET="$(TZ=Europe/Paris date '+%z')"
          TRIGGERED_SCHEDULE="${{ github.event.schedule }}"

          echo "Paris date: $PARIS_DATE"
          echo "Paris time at actual start: $PARIS_TIME"
          echo "Paris UTC offset: $PARIS_OFFSET"
          echo "Triggered cron: $TRIGGERED_SCHEDULE"

          # Summer time:
          # 08:30 UTC = 10:30 Paris when offset is +0200.
          if [ "$TRIGGERED_SCHEDULE" = "30 8 * * *" ] && \
             [ "$PARIS_OFFSET" = "+0200" ]; then

            echo "Correct Paris summer-time schedule."
            echo "run_agent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Winter time:
          # 09:30 UTC = 10:30 Paris when offset is +0100.
          if [ "$TRIGGERED_SCHEDULE" = "30 9 * * *" ] && \
             [ "$PARIS_OFFSET" = "+0100" ]; then

            echo "Correct Paris winter-time schedule."
            echo "run_agent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "DST duplicate cron run. Skipping."
          echo "run_agent=false" >> "$GITHUB_OUTPUT"

      - name: Run CNS Article Agent V6.1
        if: steps.paris_gate.outputs.run_agent == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python cns_article_agent.py

      - name: Commit updated state
        if: steps.paris_gate.outputs.run_agent == 'true'
        shell: bash
        run: |
          if git diff --quiet -- agent_state.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add agent_state.json
          git commit -m "Update CNS article state"
          git push
