name: CNS Article Agent V1 Test

on:
  workflow_dispatch:

jobs:
  retrieval-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run CNS Article Agent V1
        run: python cns_article_agent.py
